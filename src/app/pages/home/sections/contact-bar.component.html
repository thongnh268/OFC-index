<section class="contact-bar-section">
  <div class="container-content contact-bar-inner">
    <ul class="contact-list">
      <li class="contact-item">
        <span class="contact-label" i18n="@@contactBar.hotline">Hotline</span>
        <a class="contact-value" [href]="telHref()">{{ company().contact.ops.phone }}</a>
      </li>
      <li class="contact-item">
        <span class="contact-label" i18n="@@contactBar.email">Email</span>
        <a class="contact-value contact-email" [href]="mailHref()">{{ company().contact.email }}</a>
      </li>
    </ul>

    <a appButton variant="accent" class="contact-cta" routerLink="/contacts">
      <app-icon name="edit" [size]="20" />
      <span i18n="@@home.heroCta">Get a quote</span>
    </a>
  </div>
</section>
