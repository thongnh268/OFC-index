<section id="about" class="about container-content">
  <app-section-head [eyebrow]="content().eyebrow" [heading]="content().heading" />

  <div class="about-grid">
    <div class="about-media">
      @if (safeVideoUrl(); as src) {
        <iframe
          class="about-video"
          [src]="src"
          [title]="content().heading"
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
          "
          allowfullscreen
        ></iframe>
      } @else {
        <div class="about-video about-video-placeholder" aria-hidden="true"></div>
      }
    </div>

    <div class="about-details">
      @if (content().body.length) {
        <p class="about-intro">
          <app-text-segments [segments]="content().body" />
        </p>
      }

      <div class="about-block">
        <h3 class="about-label">{{ content().majorBusiness.label }}</h3>
        @if (content().majorBusiness.value.length) {
          <p class="about-value">
            <app-text-segments [segments]="content().majorBusiness.value" />
          </p>
        }
      </div>
    </div>
  </div>
</section>
