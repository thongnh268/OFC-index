<section class="products">
  <div class="container-content">
    <app-section-head
      [eyebrow]="content().eyebrow"
      [heading]="content().heading"
      [body]="content().body"
    />

    <ul class="product-grid">
      @for (item of content().items; track item.route) {
        <li class="product-card">
          @if (item.imageUrl; as imageUrl) {
            <img class="product-image" [src]="imageUrl" alt="" loading="lazy" />
          } @else {
            <div class="product-image product-image-placeholder" aria-hidden="true"></div>
          }

          <div class="product-body">
            <h3 class="product-title">{{ item.title }}</h3>
            <p class="product-desc">{{ item.description }}</p>
            <a class="product-link" [routerLink]="item.route">
              <span i18n="@@home.learnMore">Learn more</span>
              <app-icon name="chevronRight" [size]="14" />
            </a>
          </div>
        </li>
      }
    </ul>
  </div>
</section>
