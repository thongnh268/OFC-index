<app-inner-page [breadcrumb]="breadcrumb" [bannerImage]="null" [bannerAlt]="content.title">
  <h1 id="board-leadership">{{ content.title }}</h1>

  <app-board-org-chart
    [chairman]="content.chairmanLabel"
    [executive]="content.executiveLabel"
    [directors]="content.directors"
    [managers]="content.managers"
  />

  <div id="thank-you-letter" class="letter-box">
    <h2 class="inner-section-title">{{ content.letterHeading }}</h2>
    <app-inner-content [blocks]="content.blocks" />

    <div class="signature">
      <p class="signature__role">{{ content.signature.role }}</p>
      <p class="signature__signed">{{ content.signature.signed }}</p>
    </div>
  </div>
</app-inner-page>
