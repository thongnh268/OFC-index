<div class="breadcrumb-bar">
  <div class="container-content breadcrumb-bar__inner">
    <app-breadcrumb [items]="breadcrumb()" />

    @if (company().socials.length) {
      <app-social-row
        class="breadcrumb-socials"
        [links]="company().socials"
        variant="plain"
        [iconSize]="18"
      />
    }
  </div>
</div>

<app-page-banner
  [imageUrl]="bannerImage()"
  [alt]="bannerAlt()"
  [label]="bannerLabel()"
  [labelRouterLink]="bannerLabelRouterLink()"
  [labelFragment]="bannerLabelFragment()"
/>

<div class="container-content inner-page">
  <main class="inner-page__main">
    <ng-content />
  </main>

  <app-inner-sidebar
    class="inner-page__side"
    [cta]="sidebarCta()"
    [pageSections]="pageSections()"
  />
</div>

<app-quote-cta [config]="ctaConfig()" />
