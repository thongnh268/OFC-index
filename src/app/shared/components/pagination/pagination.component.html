<nav class="pagination" aria-label="Pagination" i18n-aria-label="@@pagination.label">
  <button
    class="page-button"
    type="button"
    aria-label="Previous page"
    i18n-aria-label="@@pagination.previous"
    [disabled]="currentPage() <= 1"
    (click)="goTo(currentPage() - 1)"
  >
    <app-icon name="chevronLeft" [size]="18" />
  </button>

  @for (item of items(); track $index) {
    @if (item === 'gap') {
      <span class="page-gap" aria-hidden="true">…</span>
    } @else {
      <button
        class="page-button"
        type="button"
        [class.is-current]="item === currentPage()"
        [attr.aria-current]="item === currentPage() ? 'page' : null"
        [attr.aria-label]="pageLabel(item)"
        (click)="goTo(item)"
      >
        {{ item }}
      </button>
    }
  }

  <button
    class="page-button"
    type="button"
    aria-label="Next page"
    i18n-aria-label="@@pagination.next"
    [disabled]="currentPage() >= totalPages()"
    (click)="goTo(currentPage() + 1)"
  >
    <app-icon name="chevronRight" [size]="18" />
  </button>
</nav>
