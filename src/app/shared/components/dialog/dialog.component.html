<button
  class="dialog-backdrop"
  type="button"
  aria-label="Close dialog"
  i18n-aria-label="@@dialog.close"
  [class.is-open]="open()"
  [class.dialog-backdrop--lightbox]="size() === 'lightbox'"
  [attr.aria-hidden]="!open()"
  [attr.tabindex]="open() ? 0 : -1"
  (click)="closed.emit()"
></button>

<div
  class="dialog-panel"
  role="dialog"
  [class.is-open]="open()"
  [class.dialog-panel--lightbox]="size() === 'lightbox'"
  [attr.aria-modal]="open() ? 'true' : null"
  [attr.aria-hidden]="!open()"
  [attr.aria-labelledby]="dialogId() + '-title'"
  [attr.inert]="open() ? null : ''"
  [cdkTrapFocus]="open()"
  [cdkTrapFocusAutoCapture]="open()"
  (keydown.escape)="closed.emit()"
>
  <header class="dialog-header">
    <h2 class="dialog-title" [id]="dialogId() + '-title'">{{ heading() }}</h2>
    <button
      class="dialog-close"
      type="button"
      aria-label="Close dialog"
      i18n-aria-label="@@dialog.close"
      (click)="closed.emit()"
    >
      <app-icon name="close" />
    </button>
  </header>

  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
  <div class="dialog-body" (click)="closeLightboxFromBody($event)">
    <ng-content />
  </div>
</div>
